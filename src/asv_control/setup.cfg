# ============================================================
# setup.cfg — Configuração de ONDE instalar os scripts executáveis
# ============================================================
# Este arquivo complementa o setup.py.
# Ele diz ao Python ONDE colocar os scripts que registramos
# no entry_points do setup.py.
#
# Sem este arquivo, o Python instalaria os scripts em locais
# padrão do sistema (/usr/bin/ ou ~/.local/bin/), e o ROS2
# NÃO conseguiria encontrá-los com 'ros2 run'.
#
# O ROS2 espera que os executáveis estejam em:
#   install/<pacote>/lib/<pacote>/
#
# É isso que configuramos aqui.
# ============================================================

# [develop] → Configuração para modo de DESENVOLVIMENTO
# Quando você roda 'colcon build --symlink-install',
# o colcon usa esta seção para criar links simbólicos
# dos scripts no lugar certo durante o desenvolvimento.
[develop]
# Define que os scripts ficam em: install/asv_control/lib/asv_control/
script_dir=$base/lib/asv_control

# [install] → Configuração para modo de INSTALAÇÃO FINAL
# Quando você roda 'colcon build' (sem --symlink-install),
# o colcon copia os scripts definitivamente para este local.
[install]
# Define que os scripts ficam em: install/asv_control/lib/asv_control/
install_scripts=$base/lib/asv_control